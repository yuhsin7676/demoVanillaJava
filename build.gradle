plugins {
    id 'java'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'demoVanillaJava'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

jar {

    // Указание главного класса
    manifest {
        attributes(
                'Main-Class': 'com.example.demoVanillaJava.DemoVanillaJavaApplication'
        )
    }

    // Объединение всех зависимостей
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    // Устранение конфликтов подписей (если есть)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

}

repositories {
    mavenCentral()
}

dependencies {

    // core
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
    compileOnly 'org.projectlombok:lombok:1.18.24'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.2.1'
    implementation 'com.auth0:java-jwt:4.5.1'

    // web-server
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:10.1.18'

    // swagger
    implementation 'io.swagger.core.v3:swagger-core-jakarta:2.1.13'
    implementation 'org.webjars:swagger-ui:4.15.5'

    // sql
    implementation 'org.postgresql:postgresql:42.2.16'
    implementation 'org.liquibase:liquibase-core:4.31.1'

    // kafka
    implementation 'org.apache.kafka:kafka-clients:3.6.1'

    // redis
    implementation 'redis.clients:jedis:6.2.0'

    // metrics
    implementation 'io.prometheus:simpleclient:0.6.0'
    implementation 'io.prometheus:simpleclient_servlet:0.6.0'
    implementation 'io.micrometer:micrometer-core:1.1.3'
    implementation 'io.micrometer:micrometer-registry-prometheus:1.1.3'

    // test
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.6.3'

}

tasks.named('test') {
    useJUnitPlatform()
}
